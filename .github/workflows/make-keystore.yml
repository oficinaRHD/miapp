# One-off helper (manual run only): creates the debug signing key used to keep app data between updates.
# Use it ONLY in a PRIVATE repository: the key is uploaded as an artifact that anyone with repo access can download.
# After downloading it, delete the artifact and this run. See docs/registro-sesion-48.md.
name: Make debug keystore

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          base64 -w0 debug.keystore > debug.keystore.base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore.base64.txt
          retention-days: 1
